{% extends "users/basic.html" %}

{% block title %}Confirm Delete - Admin{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
  <div class="card shadow">
    <div class="card-header bg-danger text-white">
      <h5 class="mb-0"><i class="fas fa-exclamation-triangle mr-2"></i>Confirm Deletion</h5>
    </div>
    <div class="card-body text-center py-4">
      <p class="h5 mb-3">Are you sure you want to delete this {{ type }}?</p>
      <p class="font-weight-bold text-dark">{{ object }}</p>
      <p class="text-muted small">This action cannot be undone.</p>

      <form method="post">
        {% csrf_token %}
        <div class="mt-4">
          <a href="{% url cancel_url %}" class="btn btn-secondary mr-2">Cancel</a>
          <button type="submit" class="btn btn-danger">Confirm Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
