<div class="card mb-4 shadow-sm border-0 bg-dark text-white">
  <div class="card-body py-2 px-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
      <div class="d-flex align-items-center flex-wrap py-1">
        <span class="badge badge-danger mr-3 px-2 py-1 font-weight-bold" style="font-size: 13px;">
          <i class="fas fa-user-shield mr-1"></i>ADMIN PANEL
        </span>

        <a href="{% url 'admin_dashboard' %}" class="btn btn-sm text-white mr-1 {% if request.resolver_match.url_name == 'admin_dashboard' %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-tachometer-alt mr-1"></i>Dashboard
        </a>

        <a href="{% url 'admin_manage_movies' %}" class="btn btn-sm text-white mr-1 {% if 'movie' in request.resolver_match.url_name %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-film mr-1"></i>Movies
        </a>

        <a href="{% url 'admin_manage_theaters' %}" class="btn btn-sm text-white mr-1 {% if 'theater' in request.resolver_match.url_name %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-building mr-1"></i>Theaters
        </a>

        <a href="{% url 'admin_manage_schedules' %}" class="btn btn-sm text-white mr-1 {% if 'schedule' in request.resolver_match.url_name %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-calendar-alt mr-1"></i>Schedules
        </a>

        <a href="{% url 'admin_bulk_schedule_add' %}" class="btn btn-sm text-warning mr-1 {% if request.resolver_match.url_name == 'admin_bulk_schedule_add' %}btn-warning text-dark font-weight-bold{% endif %}">
          <i class="fas fa-bolt mr-1"></i>Bulk Generator
        </a>

        <a href="{% url 'admin_manage_seats' %}" class="btn btn-sm text-white mr-1 {% if request.resolver_match.url_name == 'admin_manage_seats' %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-chair mr-1"></i>Seats Layout
        </a>

        <a href="{% url 'admin_manage_screens' %}" class="btn btn-sm text-white mr-1 {% if 'screen' in request.resolver_match.url_name %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-desktop mr-1"></i>Screens
        </a>

        <a href="{% url 'admin_manage_taxonomies' %}" class="btn btn-sm text-white mr-1 {% if request.resolver_match.url_name == 'admin_manage_taxonomies' %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-tags mr-1"></i>Taxonomies
        </a>

        <a href="{% url 'admin_manage_bookings' %}" class="btn btn-sm text-white mr-1 {% if request.resolver_match.url_name == 'admin_manage_bookings' %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-ticket-alt mr-1"></i>User Bookings
        </a>

        <a href="{% url 'admin_manage_reports' %}" class="btn btn-sm text-white mr-1 {% if request.resolver_match.url_name == 'admin_manage_reports' %}btn-primary font-weight-bold{% endif %}">
          <i class="fas fa-flag mr-1"></i>Reports
        </a>
      </div>

      <div class="py-1">
        <a href="{% url 'admin:index' %}" target="_blank" class="btn btn-sm btn-outline-light">
          <i class="fas fa-external-link-alt mr-1"></i>Django Native Admin
        </a>
      </div>
    </div>
  </div>
</div>
