<div class="card shadow-sm border-0 mb-4 bg-white rounded-lg">
  <div class="card-body p-3">
    <form method="GET" action="" id="dateRangeFilterForm" class="form-inline d-flex flex-wrap align-items-center justify-content-between" onsubmit="return validateAndSubmitFilter(event)">
      <div class="d-flex align-items-center flex-wrap mb-2 mb-md-0">
        <span class="font-weight-bold text-dark mr-3 mb-2 mb-sm-0">
          <i class="fas fa-filter text-primary mr-1"></i> Date Filter:
        </span>

        <div class="form-group mr-2 mb-2 mb-sm-0">
          <label for="startDateInput" class="sr-only">Start Date</label>
          <div class="input-group input-group-sm">
            <div class="input-group-prepend">
              <span class="input-group-text bg-light text-muted"><i class="far fa-calendar-alt"></i></span>
            </div>
            <input type="date" class="form-control form-control-sm" id="startDateInput" name="start_date" value="{{ start_date|default:'' }}" placeholder="Start Date">
          </div>
        </div>

        <span class="text-muted mr-2 mb-2 mb-sm-0">to</span>

        <div class="form-group mr-3 mb-2 mb-sm-0">
          <label for="endDateInput" class="sr-only">End Date</label>
          <div class="input-group input-group-sm">
            <div class="input-group-prepend">
              <span class="input-group-text bg-light text-muted"><i class="far fa-calendar-alt"></i></span>
            </div>
            <input type="date" class="form-control form-control-sm" id="endDateInput" name="end_date" value="{{ end_date|default:'' }}" placeholder="End Date">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-sm px-3 mb-2 mb-sm-0 font-weight-bold" id="filterSubmitBtn">
          <i class="fas fa-search mr-1" id="filterSearchIcon"></i>
          <span id="filterBtnText">Apply Filter</span>
        </button>
      </div>

      <div class="btn-group btn-group-sm mb-2 mb-md-0" role="group" aria-label="Quick Presets">
        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('today')">Today</button>
        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('7days')">Last 7 Days</button>
        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('30days')">Last 30 Days</button>
        <a href="{{ request.path }}" class="btn btn-outline-danger" title="Reset Filters"><i class="fas fa-undo mr-1"></i> Reset</a>
      </div>
    </form>
  </div>
</div>

<script>
  function validateAndSubmitFilter(e) {
    const startVal = document.getElementById('startDateInput').value;
    const endVal = document.getElementById('endDateInput').value;
    
    if (startVal && endVal && startVal > endVal) {
      alert("Start Date cannot be later than End Date. Please select a valid date range.");
      if (e && e.preventDefault) e.preventDefault();
      return false;
    }

    const btn = document.getElementById('filterSubmitBtn');
    const icon = document.getElementById('filterSearchIcon');
    const text = document.getElementById('filterBtnText');
    if (btn && icon && text) {
      btn.disabled = true;
      icon.className = 'fas fa-spinner fa-spin mr-1';
      text.innerText = 'Applying...';
    }
    return true;
  }

  function setDatePreset(preset) {
    const today = new Date();
    const startDateInput = document.getElementById('startDateInput');
    const endDateInput = document.getElementById('endDateInput');
    
    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    if (preset === 'today') {
      const todayStr = formatDate(today);
      startDateInput.value = todayStr;
      endDateInput.value = todayStr;
    } else if (preset === '7days') {
      const past = new Date(today);
      past.setDate(past.getDate() - 7);
      startDateInput.value = formatDate(past);
      endDateInput.value = formatDate(today);
    } else if (preset === '30days') {
      const past = new Date(today);
      past.setDate(past.getDate() - 30);
      startDateInput.value = formatDate(past);
      endDateInput.value = formatDate(today);
    }
    
    validateAndSubmitFilter();
    document.getElementById('dateRangeFilterForm').submit();
  }
</script>
