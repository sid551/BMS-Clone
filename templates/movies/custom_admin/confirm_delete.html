{% extends "movies/custom_admin/base_admin.html" %}

{% block title %}Confirm Delete - Admin Console{% endblock %}

{% block admin_content %}
<div class="container-fluid p-0">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 500px; margin-top: 2rem;">
    <div class="card-header bg-danger text-white font-weight-bold py-3">
      <h5 class="mb-0"><i class="fas fa-exclamation-triangle mr-2"></i>Confirm Deletion</h5>
    </div>
    <div class="card-body text-center py-4">
      <p class="h5 mb-3">Are you sure you want to delete this {{ type }}?</p>
      <p class="font-weight-bold text-dark h6">{{ object }}</p>
      <p class="text-muted small">This action cannot be undone.</p>

      <form method="post">
        {% csrf_token %}
        <div class="mt-4">
          <a href="{% url cancel_url %}" class="btn btn-secondary font-weight-bold mr-2">Cancel</a>
          <button type="submit" class="btn btn-danger font-weight-bold">Confirm Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
