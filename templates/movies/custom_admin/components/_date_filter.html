<div class="card shadow-smooth border-0 mb-4 bg-white">
  <div class="card-body p-3">
    <form method="GET" action="" id="dateRangeFilterForm" class="d-flex flex-wrap align-items-center justify-content-between gap-3" onsubmit="return validateAndSubmitFilter(event)">
      
      <!-- Left: Date Picker Inputs & Submit Button -->
      <div class="d-flex align-items-center flex-wrap gap-2">
        <span class="font-weight-bold text-dark mr-1" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">
          <i class="fas fa-filter text-primary mr-1"></i> Date Filter:
        </span>

        <!-- Start Date -->
        <div class="input-group input-group-sm" style="width: auto;">
          <div class="input-group-prepend">
            <span class="input-group-text bg-light text-muted"><i class="far fa-calendar-alt"></i></span>
          </div>
          <input type="date" class="form-control form-control-sm" id="startDateInput" name="start_date" value="{{ start_date|default:'' }}" placeholder="Start Date">
        </div>

        <span class="text-muted small font-weight-bold mx-1">to</span>

        <!-- End Date -->
        <div class="input-group input-group-sm" style="width: auto;">
          <div class="input-group-prepend">
            <span class="input-group-text bg-light text-muted"><i class="far fa-calendar-alt"></i></span>
          </div>
          <input type="date" class="form-control form-control-sm" id="endDateInput" name="end_date" value="{{ end_date|default:'' }}" placeholder="End Date">
        </div>

        <!-- Apply Button -->
        <button type="submit" class="btn btn-primary btn-sm px-3 font-weight-bold shadow-sm" id="filterSubmitBtn">
          <i class="fas fa-search mr-1" id="filterSearchIcon"></i>
          <span id="filterBtnText">Apply Filter</span>
        </button>
      </div>

      <!-- Right: Quick Presets & Reset -->
      <div class="d-flex align-items-center gap-1 flex-wrap">
        <div class="btn-group btn-group-sm mr-2" role="group" aria-label="Quick Presets">
          <button type="button" class="btn btn-outline-secondary font-weight-semibold" onclick="setDatePreset('daily')"><i class="fas fa-calendar-day mr-1"></i> Daily</button>
          <button type="button" class="btn btn-outline-secondary font-weight-semibold" onclick="setDatePreset('weekly')"><i class="fas fa-calendar-week mr-1"></i> Weekly</button>
          <button type="button" class="btn btn-outline-secondary font-weight-semibold" onclick="setDatePreset('monthly')"><i class="fas fa-calendar-alt mr-1"></i> Monthly</button>
          <button type="button" class="btn btn-outline-secondary font-weight-semibold" onclick="setDatePreset('yearly')"><i class="fas fa-calendar mr-1"></i> Yearly</button>
        </div>
        <a href="{{ request.path }}" class="btn btn-sm btn-outline-danger font-weight-bold" title="Reset Filters"><i class="fas fa-undo mr-1"></i> Reset</a>
      </div>
    </form>
  </div>
</div>

<script>
  function validateAndSubmitFilter(e) {
    const startVal = document.getElementById('startDateInput').value;
    const endVal = document.getElementById('endDateInput').value;
    
    if (startVal && endVal && startVal > endVal) {
      alert("Start Date cannot be later than End Date. Please select a valid date range.");
      if (e && e.preventDefault) e.preventDefault();
      return false;
    }

    const btn = document.getElementById('filterSubmitBtn');
    const icon = document.getElementById('filterSearchIcon');
    const text = document.getElementById('filterBtnText');
    if (btn && icon && text) {
      btn.disabled = true;
      icon.className = 'fas fa-spinner fa-spin mr-1';
      text.innerText = 'Applying...';
    }
    return true;
  }

  function setDatePreset(preset) {
    const today = new Date();
    const startDateInput = document.getElementById('startDateInput');
    const endDateInput = document.getElementById('endDateInput');
    
    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    if (preset === 'today' || preset === 'daily') {
      const todayStr = formatDate(today);
      startDateInput.value = todayStr;
      endDateInput.value = todayStr;
    } else if (preset === '7days' || preset === 'weekly') {
      const past = new Date(today);
      past.setDate(past.getDate() - 7);
      startDateInput.value = formatDate(past);
      endDateInput.value = formatDate(today);
    } else if (preset === '30days' || preset === 'monthly') {
      const past = new Date(today);
      past.setDate(past.getDate() - 30);
      startDateInput.value = formatDate(past);
      endDateInput.value = formatDate(today);
    } else if (preset === '365days' || preset === 'yearly') {
      const past = new Date(today);
      past.setDate(past.getDate() - 365);
      startDateInput.value = formatDate(past);
      endDateInput.value = formatDate(today);
    }
    
    validateAndSubmitFilter();
    document.getElementById('dateRangeFilterForm').submit();
  }
</script>
